services:
  registration-service:
    build: ./registration_microservice
    container_name: registrationservice-container
    ports:
      - "5001:5001"
    env_file:
      - ./registration_microservice/.env

  authentication-service:
    build: ./authentication_microservice
    container_name: authenticationservice-container
    ports:
      - "5002:5002"
    env_file:
      - ./authentication_microservice/.env